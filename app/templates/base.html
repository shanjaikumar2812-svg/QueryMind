<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}QueryMind{% endblock %}</title>
  <meta name="description" content="QueryMind — upload a CSV and ask questions in plain English. Get SQL, charts, and forecasts back instantly.">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

  <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% include "partials/navbar.html" %}

  <main class="qm-main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/modals.html" %}

  <div id="qm-toast-root" class="qm-toast-root"></div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
